name: OpenCode PR Review
description: OpenCode PR review with re-review mode detection.

inputs:
  api_key:
    description: API key for the model provider (e.g. OpenRouter, OpenCode).
    required: false
    default: ""
  api_key_env:
    description: >-
      Override for the env var name the API key is exported under. Leave
      empty (default) to auto-derive from the provider prefix in `model`
      (e.g. openrouter/... -> OPENROUTER_API_KEY). Only needed for a
      provider not in the toolkit's known table.
    required: false
    default: ""
  model:
    description: OpenCode model.
    required: false
    default: opencode-go/deepseek-v4-pro
  variant:
    description: OpenCode variant.
    required: false
    default: max
  mentions:
    description: Mention command passed to OpenCode.
    required: false
    default: /review
  share:
    description: Whether OpenCode sharing is enabled.
    required: false
    default: "false"
  use_github_token:
    description: Use GitHub Actions GITHUB_TOKEN instead of OpenCode GitHub App token exchange.
    required: false
    default: "false"
  github_token:
    description: GitHub token passed to OpenCode when use_github_token is true.
    required: false
    default: ${{ github.token }}
  extra_prompt:
    description: Extra consuming-repo review instructions.
    required: false
    default: ""
  issue_number:
    description: PR/issue number for workflow_dispatch triggers (leave empty for issue_comment triggers).
    required: false
    default: ""
  verdict_marker:
    description: HTML comment marker identifying a completed review verdict (used in mode detection and loop guard).
    required: false
    default: "<!-- opencode-pr-review -->"
  head_marker:
    description: HTML comment marker identifying the reviewed HEAD SHA (used in loop guard and verify).
    required: false
    default: "<!-- reviewed-head:"
  skip_context:
    description: Skip the toolkit's built-in context preparation (use when the caller provides its own compiled context at review_context.md).
    required: false
    default: "false"
  serena:
    description: Enable Serena MCP symbol lookup during review (fail-open if unavailable).
    required: false
    default: "true"
  serena_sha:
    description: Exact 40-char commit SHA of oraios/serena to install.
    required: false
    default: "dd12fa032f473a53595763b8d731817e19c15475"
  fail_closed_context:
    description: Abort the review when compiled context status is BLOCKED.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # ── Export provider API key under its provider-specific env var name ───
    # Env var *names* can't be built from expressions in a declarative `env:`
    # map, so this exports it via $GITHUB_ENV instead. The value itself never
    # appears in the run script's logged source (bash expands $API_KEY_VALUE
    # at runtime, not the Actions expression engine at log time).
    #
    # api_key_env is an override — by default the env var name is derived
    # from model's provider prefix, so consuming repos only ever need to set
    # `model` + `api_key`, never opencode's internal per-provider env names.
    - name: Export provider API key
      shell: bash
      env:
        API_KEY_VALUE: ${{ inputs.api_key }}
        API_KEY_OVERRIDE: ${{ inputs.api_key_env }}
        MODEL: ${{ inputs.model }}
      run: |
        if [ -n "${API_KEY_OVERRIDE}" ]; then
          API_KEY_NAME="${API_KEY_OVERRIDE}"
        else
          PROVIDER="${MODEL%%/*}"
          case "${PROVIDER}" in
            opencode-go) API_KEY_NAME=OPENCODE_API_KEY ;;
            openrouter)  API_KEY_NAME=OPENROUTER_API_KEY ;;
            anthropic)   API_KEY_NAME=ANTHROPIC_API_KEY ;;
            openai)      API_KEY_NAME=OPENAI_API_KEY ;;
            deepseek)    API_KEY_NAME=DEEPSEEK_API_KEY ;;
            groq)        API_KEY_NAME=GROQ_API_KEY ;;
            *)
              echo "::error::No known api_key_env mapping for provider '${PROVIDER}' (from model '${MODEL}'). Set api_key_env explicitly to override."
              exit 1
              ;;
          esac
        fi
        echo "${API_KEY_NAME}=${API_KEY_VALUE}" >> "$GITHUB_ENV"

    # ── PR metadata + mode detection ───────────────────────────────────────
    - name: Resolve PR metadata and acknowledge
      id: pr-info
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const issueNumber = ${{ inputs.issue_number }} || context.payload.issue.number;
          const commentId = context.payload.comment ? context.payload.comment.id : null;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

          const { data: pr } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: issueNumber
          });

          if (pr.draft) {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: '**OpenCode review skipped:** PR is still a draft.'
            });
            core.setOutput('skip', 'true');
            return;
          }

          // Detect mode: search for prior verdict marker comments.
          // The verdict marker is the definitive signal that a full
          // OpenCode review cycle completed on this PR.
          const verdictMarker = '${{ inputs.verdict_marker }}';
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number: issueNumber, per_page: 100
          });
          const priorVerdicts = comments.filter(c =>
            c.user.login === 'github-actions[bot]' &&
            c.body.includes(verdictMarker)
          );
          const mode = ${{ inputs.issue_number }} ? 'review' : (priorVerdicts.length === 0 ? 'review' : 're-review');
          core.info(`==> Mode: ${mode} (${priorVerdicts.length} prior verdict(s))`);

          if (commentId) {
            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: commentId,
              content: 'eyes'
            });
          }

          const pocMarker = ${{ inputs.issue_number }} ? ' [Serena POC]' : '';
          const emoji = mode === 'review' ? '🔍' : '🔄';
          const label = mode === 'review' ? 'OpenCode review started' : 'OpenCode re-review started';
          await github.rest.issues.createComment({
            owner, repo, issue_number: issueNumber,
            body: `${emoji} **${label}${pocMarker}** for commit \`${pr.head.sha.slice(0, 7)}\`. [View workflow run](${runUrl})`
          });

          core.setOutput('skip',       'false');
          core.setOutput('head_sha',   pr.head.sha);
          core.setOutput('pr_url',     pr.html_url);
          core.setOutput('mode',       mode);
          core.setOutput('pr_author',  pr.user.login);

    # ── Re-review: pre-flight guard ───────────────────────────────────────
    - name: Re-review pre-flight check
      id: preflight
      if: steps.pr-info.outputs.skip == 'false' && steps.pr-info.outputs.mode == 're-review'
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const owner    = context.repo.owner;
          const repo     = context.repo.repo;
          const prNum    = context.payload.issue.number;

          // Fetch all inline comments by github-actions[bot] that match the
          // OpenCode review format ([SEVERITY] prefix).
          const { data: inlineComments } = await github.rest.pulls.listReviewComments({
            owner, repo, pull_number: prNum, per_page: 100
          });
          const severityPrefixes = /^\[(CRITICAL|HIGH|MEDIUM|LOW)\]/;
          const reviewerComments = inlineComments.filter(c =>
            c.user.login === 'github-actions[bot]' &&
            severityPrefixes.test(c.body || '')
          );

          if (reviewerComments.length === 0) {
            // Phase 2.1: No prior inline reviewer comments.
            // If HEAD changed since the last verdict, the prior run was incomplete
            // (verdict posted but inline batch failed/timed out). Auto-switch to
            // a fresh full review.
            const currentHeadSha = '${{ steps.pr-info.outputs.head_sha }}';
            const { data: allIssueComments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNum, per_page: 100
            });
            const verdictMarker = '${{ inputs.verdict_marker }}';
            const headMarker = '${{ inputs.head_marker }}';
            const verdictComments = allIssueComments
              .filter(c => c.user.login === 'github-actions[bot]' && c.body.includes(verdictMarker) && c.body.includes(headMarker))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let lastVerdictSha = null;
            if (verdictComments.length > 0) {
              const match = verdictComments[0].body.match(new RegExp(headMarker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' ([a-f0-9]+) -->'));
              if (match) lastVerdictSha = match[1];
            }

            if (lastVerdictSha && lastVerdictSha !== currentHeadSha) {
              core.info(`Phase 2.1: No inline comments but HEAD changed (${lastVerdictSha.slice(0, 7)} → ${currentHeadSha.slice(0, 7)}) — auto-switching to fresh full review`);
              core.setOutput('skip', 'false');
              core.setOutput('mode_override', 'review');
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: prNum,
              body: '**OpenCode re-review skipped:** No prior inline review comments found from the last OpenCode review. This PR has not been fully reviewed yet. Triggering a fresh review instead is recommended — delete the existing `PR Verdict:` comment and comment `/review` again.'
            });
            core.setOutput('skip', 'true');
            return;
          }

          // Phase 2.3: Check if a complete review cycle already exists for this HEAD.
          const currentHeadSha = '${{ steps.pr-info.outputs.head_sha }}';
          const { data: issueComments } = await github.rest.issues.listComments({
            owner, repo, issue_number: prNum, per_page: 100
          });
          const verdictForCurrentHead = issueComments.some(c =>
            c.user.login === 'github-actions[bot]' &&
            c.body.includes(verdictMarker) &&
            c.body.includes(`${headMarker} ${currentHeadSha} -->`)
          );

          if (verdictForCurrentHead) {
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNum,
              body: `**OpenCode re-review skipped:** No changes since last review (head is still \`${currentHeadSha.slice(0, 7)}\`). Push new commits or force-push a rebase to trigger a re-review.`
            });
            core.setOutput('skip', 'true');
            return;
          }

          core.setOutput('skip', 'false');

    # ── Re-review: verify commenter is PR author or trusted member ──────────
    - name: Re-review security check
      id: security
      if: steps.pr-info.outputs.skip == 'false' && steps.pr-info.outputs.mode == 're-review' && steps.preflight.outputs.skip != 'true' && steps.preflight.outputs.mode_override != 'review'
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const commenterLogin = context.payload.comment.user.login;
          const authorAssoc    = context.payload.comment.author_association;
          const prAuthor       = '${{ steps.pr-info.outputs.pr_author }}';
          const trusted        = ['OWNER', 'MEMBER', 'COLLABORATOR'];

          if (commenterLogin !== prAuthor && !trusted.includes(authorAssoc)) {
            core.info(`${commenterLogin} is not the PR author or a trusted member — skipping re-review`);
            core.setOutput('skip', 'true');
            return;
          }
          core.setOutput('skip', 'false');

    # ── Review mode: guard against reviewing the same commit twice ──────────
    - name: Loop guard
      id: loop_guard
      if: steps.pr-info.outputs.skip == 'false' && (steps.pr-info.outputs.mode == 'review' || steps.preflight.outputs.mode_override == 'review')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        HEAD_SHA="${{ steps.pr-info.outputs.head_sha }}"
        PR_NUMBER="${{ inputs.issue_number || github.event.issue.number }}"
        REPO="${{ github.repository }}"

        # Check if a *complete* OpenCode review cycle already exists for this HEAD.
        # A complete cycle is proven by a verdict comment containing both markers.
        #
        # Do NOT use pull review comment commit_id here. GitHub can rebind inline
        # comments to the current PR head after later pushes/merges, which causes
        # false "already reviewed" skips even when this HEAD never received a full
        # verdict. The verdict marker is the stable source of truth.
        EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --paginate \
          --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${{ inputs.verdict_marker }}\")) and (.body | contains(\"${{ inputs.head_marker }} ${HEAD_SHA} -->\")))] | length")

        if [ "${EXISTING}" -gt "0" ]; then
          echo "Loop guard: complete review already exists for commit ${HEAD_SHA} — skipping"
          gh pr comment "${PR_NUMBER}" \
            --body "**OpenCode review skipped:** Commit \`${HEAD_SHA:0:7}\` was already fully reviewed. Push a new commit to trigger a re-review."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    # ── Context preparation (both modes) ────────────────────────────────────
    - name: Prepare review context
      id: context
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true' &&
        inputs.skip_context != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        REPO: ${{ github.repository }}
      run: |
        BASE_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.base.sha')
        HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
        for scratch in "review_context.md" ".opencode/"; do
          grep -Fxq "$scratch" .git/info/exclude 2>/dev/null || echo "$scratch" >> .git/info/exclude
        done
        gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' \
          | node -e "process.stdout.write(JSON.stringify(require('fs').readFileSync(0,'utf8').split('\n').filter(Boolean)))" \
          > "${RUNNER_TEMP}/changed-files.json"
        set +e
        node "${{ github.action_path }}/context/prepare-review-context.mjs" \
          --workspace "$PWD" \
          --trusted-ref "$BASE_SHA" \
          --changed-files "${RUNNER_TEMP}/changed-files.json" \
          --org-contexts-dir "${{ github.action_path }}/context/contexts" \
          --max-bytes 500000 | tee "${RUNNER_TEMP}/context-output.txt"
        STATUS_LINE=$(grep -o 'REVIEW_CONTEXT_STATUS=[A-Z_]*' "${RUNNER_TEMP}/context-output.txt" | head -1 | cut -d= -f2)
        set -e
        echo "verdict=${STATUS_LINE:-BLOCKED}" >> "$GITHUB_OUTPUT"
        echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
        echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        cp "$PWD/.opencode/tmp/review_context.md" "$PWD/review_context.md" 2>/dev/null || true
        if [ "${{ inputs.fail_closed_context }}" = "true" ] && [ "${STATUS_LINE}" = "BLOCKED" ]; then
          echo "::error::Compiled review context is BLOCKED — required context is missing or incomplete."
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "**OpenCode review aborted:** required review context is missing or incomplete (status BLOCKED). Run the \`initialize-review-context\` skill and fill required gap stubs."
          exit 1
        fi

    # ── Context summary comment ────────────────────────────────────────────
    - name: Post context summary
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true' &&
        inputs.skip_context != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PR_NUMBER="${{ inputs.issue_number || github.event.issue.number }}"
        STATUS="${{ steps.context.outputs.verdict }}"
        SOURCES=$(grep -c "^## Source: " review_context.md || echo 0)
        LINE_COUNT=$(wc -l < review_context.md | tr -d ' ')
        gh pr comment "$PR_NUMBER" --body "$(printf '📋 **Review context compiled** — status \`%s\` · %s source(s) · %s lines' "$STATUS" "$SOURCES" "$LINE_COUNT")"

    # ── Serena MCP setup (fail-open) ─────────────────────────────────────────
    - name: Set up Serena MCP
      id: serena
      if: |
        inputs.serena == 'true' &&
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      run: |
        SERENA_HOME="$RUNNER_TEMP/serena"
        STATUS_JSON="$RUNNER_TEMP/serena-status.json"
        bash "${{ github.action_path }}/serena/install-and-probe.sh" \
          "${{ inputs.serena_sha }}" "$SERENA_HOME" "$STATUS_JSON" || true
        STATUS=$(node -pe "try { JSON.parse(require('fs').readFileSync('$STATUS_JSON','utf8')).status } catch { 'unavailable' }")
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "status_json=$STATUS_JSON" >> "$GITHUB_OUTPUT"
        if [ "$STATUS" = "available" ]; then
          echo "SERENA_HOME=$SERENA_HOME" >> "$GITHUB_ENV"
          mkdir -p .opencode
          if [ -f .opencode/opencode.json ]; then
            BASE=.opencode/opencode.json
          else
            BASE=/dev/stdin
          fi
          jq -n --arg home "$SERENA_HOME" '{
            "$schema": "https://opencode.ai/config.json",
            "mcp": { "serena": { "type": "local", "command": [($home + "/bin/serena-readonly"), "."], "enabled": true, "timeout": 30000 } },
            "tools": { "serena*": true }
          }' > "$RUNNER_TEMP/serena-config.json"
          if [ -f .opencode/opencode.json ]; then
            jq -s '.[0] * .[1]' .opencode/opencode.json "$RUNNER_TEMP/serena-config.json" > "$RUNNER_TEMP/merged.json"
            cp "$RUNNER_TEMP/merged.json" .opencode/opencode.json
          else
            cp "$RUNNER_TEMP/serena-config.json" .opencode/opencode.json
          fi
        fi

    # ── Prepare workspace-local OpenCode instruction files ───────────────────
    - name: Prepare OpenCode instruction files
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      env:
        EXTRA_PROMPT: ${{ inputs.extra_prompt }}
      run: |
        mkdir -p .opencode .opencode/tmp

        cp "${{ github.action_path }}/../skills/review-pr/SKILL.md" .opencode/review-pr.base.md
        cp "${{ github.action_path }}/../skills/re-review-pr/SKILL.md" .opencode/re-review-pr.base.md

        cat > .opencode/review-pr.instructions.md <<EOF
        OpenCode additions:
        1. OVERRIDE of base skill Phase 4 Step 1: do NOT call \`gh pr comment\` yourself for the verdict, under any circumstance, even though the base skill instructs it. This Action posts your final response as the PR comment automatically. Calling \`gh pr comment\` yourself in addition to returning a final response produces two separate, incomplete comments and breaks the review-completion loop guard.
        2. Return the ENTIRE PR verdict (all sections from the base skill's Phase 4 template) as your single final response — this is the ONLY place the verdict is emitted. Base skill Phase 4 Step 2 ("output the same verdict to the conversation") still applies.
        3. All inline comments must still be posted via GitHub API exactly as the base skill instructs.
        4. Terminate your final response with the following lines, in this exact order, immediately adjacent with no other content between them:

        ${{ inputs.head_marker }} ${{ steps.pr-info.outputs.head_sha }} -->
        ${{ inputs.verdict_marker }}
        <!-- findings-json-start
        [
          {
            "severity": "CRITICAL",
            "path": "example/file.go",
            "line": 42,
            "title": "Short finding title",
            "body": "Why this is a problem and what breaks downstream.",
            "suggested_fix": "Concrete fix intent."
          }
        ]
        findings-json-end -->

        5. Every finding posted inline MUST appear in this JSON array. If there are no findings, emit \`[]\`.
        6. Each finding MUST include \`suggested_fix\` with a concrete actionable fix in 1-2 sentences.
        7. Comment-only mode: do not edit repository files, do not create patches, do not run formatters, and do not run any git write operations (\`git add\`, \`git commit\`, \`git push\`, \`git checkout -b\`, \`git merge\`, \`git rebase\`). Output must be PR comments only.
        8. For any scratch files or temporary payloads, use workspace-local paths under \`.opencode/tmp/\`. Never read from or write to \`/tmp\` or any path outside the repository checkout.
        EOF

        cat > .opencode/re-review-pr.instructions.md <<EOF
        OpenCode additions:
        1. OVERRIDE of base skill Phase 4 Step 1: do NOT call \`gh pr comment\` yourself for the verdict, under any circumstance, even though the base skill instructs it. This Action posts your final response as the PR comment automatically. Calling \`gh pr comment\` yourself in addition to returning a final response produces two separate, incomplete comments and breaks the review-completion loop guard.
        2. Return the ENTIRE PR verdict as your single final response — this is the ONLY place the verdict is emitted.
        3. Terminate your final response with the following lines, in this exact order, immediately adjacent with no other content between them:

        ${{ inputs.head_marker }} ${{ steps.pr-info.outputs.head_sha }} -->
        ${{ inputs.verdict_marker }}
        <!-- findings-json-start
        [
          {
            "severity": "CRITICAL",
            "path": "example/file.go",
            "line": 42,
            "title": "Short finding title",
            "body": "Why this is a problem and what breaks downstream.",
            "suggested_fix": "Concrete fix intent."
          }
        ]
        findings-json-end -->

        4. Include ALL new findings from re-review in this JSON array. If there are no findings, emit \`[]\`.
        5. Each finding MUST include \`suggested_fix\`.
        6. Comment-only mode: do not edit repository files, do not create patches, and do not run any git write operations (\`git add\`, \`git commit\`, \`git push\`, \`git checkout -b\`, \`git merge\`, \`git rebase\`). Output must be PR comments only.
        7. For any scratch files or temporary payloads, use workspace-local paths under \`.opencode/tmp/\`. Never read from or write to \`/tmp\` or any path outside the repository checkout.
        EOF

        cat .opencode/review-pr.base.md .opencode/review-pr.instructions.md > .opencode/review-pr.opencode.md
        cat .opencode/re-review-pr.base.md .opencode/re-review-pr.instructions.md > .opencode/re-review-pr.opencode.md

        if [ -n "${EXTRA_PROMPT}" ]; then
          {
            printf '\n\n## Repository rules\n\n'
            printf '%s\n' "${EXTRA_PROMPT}"
          } >> .opencode/review-pr.opencode.md
          {
            printf '\n\n## Repository rules\n\n'
            printf '%s\n' "${EXTRA_PROMPT}"
          } >> .opencode/re-review-pr.opencode.md
        fi

    # ── Guard: review mode must stay comment-only / clean ────────────────────
    - name: Ensure review workspace is clean before OpenCode runs
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::Review workspace is dirty before OpenCode starts. Comment-only review mode forbids git writes."
          git status --short
          gh pr comment "${{ inputs.issue_number || github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "**OpenCode review aborted:** workspace became dirty before review started. Comment-only review mode forbids git add/commit/push. Check scratch-file handling in the action."
          exit 1
        fi

    # ── Inject PR context for opencode (workflow_dispatch) ──────────────────
    # opencode github run reads context.payload.issue.number from the event file
    # at startup. For workflow_dispatch, inject it so the review posts to the
    # correct PR. Issue_comment triggers already have the context — skip.
    - name: Inject PR context for opencode
      if: inputs.issue_number != ''
      shell: bash
      run: |
        jq '. + { issue: { number: ($issueNum|tonumber), pull_request: {} } }' \
          --arg issueNum "${{ inputs.issue_number }}" \
          "$GITHUB_EVENT_PATH" > /tmp/event.json
        mv /tmp/event.json "$GITHUB_EVENT_PATH"
        echo "Injected issue context for opencode: issue.number=${{ inputs.issue_number }}"

    # ── Full review (first-time) ─────────────────────────────────────────────
    - name: Run full review
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        (steps.pr-info.outputs.mode == 'review' || steps.preflight.outputs.mode_override == 'review') &&
        steps.loop_guard.outputs.skip != 'true'
      uses: anomalyco/opencode/github@v1.17.6
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        TMPDIR: ${{ github.workspace }}/.opencode/tmp
      with:
        model: ${{ inputs.model }}
        variant: ${{ inputs.variant }}
        mentions: ${{ inputs.mentions }}
        share: ${{ inputs.share }}
        use_github_token: ${{ inputs.use_github_token }}
        prompt: |
          AUTOMATED MODE: You are running as a GitHub Actions bot.
          Skip Phase 2.5 (Human Approval Gate) — post all findings directly without waiting for approval.
          Do not ask any questions. Complete all phases through Phase 4 (Emit Verdict) without interruption.
          REVIEWER_LOGIN is 'github-actions[bot]'.
          The PR URL is: ${{ steps.pr-info.outputs.pr_url }}

          FIRST: Read the workspace-local file ".opencode/review-pr.opencode.md" and follow all its instructions exactly.

    # ── Re-review (subsequent /review after prior feedback) ─────────────────
    - name: Run re-review
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.pr-info.outputs.mode == 're-review' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.preflight.outputs.mode_override != 'review' &&
        steps.security.outputs.skip != 'true'
      uses: anomalyco/opencode/github@v1.17.6
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        TMPDIR: ${{ github.workspace }}/.opencode/tmp
      with:
        model: ${{ inputs.model }}
        variant: ${{ inputs.variant }}
        mentions: ${{ inputs.mentions }}
        share: ${{ inputs.share }}
        use_github_token: ${{ inputs.use_github_token }}
        prompt: |
          AUTOMATED MODE: You are running as a GitHub Actions bot.
          Skip Phase 3 approval gate — automatically proceed with the classification table without waiting for YES.
          Skip Phase 7 approval gate — automatically post all new findings without waiting for YES.
          All other phases execute exactly as documented in the skill.
          REVIEWER_LOGIN is 'github-actions[bot]'.
          The PR URL is: ${{ steps.pr-info.outputs.pr_url }}

          FIRST: Read the workspace-local file ".opencode/re-review-pr.opencode.md" and follow all its instructions exactly.

    # ── Verify review comment is posted ─────────────────────────────────────
    - name: Verify review comment is posted
      id: review-comment-id
      if: |
        steps.pr-info.outputs.skip != 'true' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
      run: |
        found=0
        for i in $(seq 6); do
          comment_id=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "map(select(.body | contains(\"/actions/runs/${{ github.run_id }}\"))) | sort_by(.created_at) | last | .id // empty")
          if [ -n "${comment_id}" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${comment_id}" \
              --jq '.body' | \
              sed 's/\[github run\]/[View workflow run]/' | \
              jq -Rs '{body: .}' | \
              gh api "repos/${{ github.repository }}/issues/comments/${comment_id}" --method PATCH --input -
            found=1
            break
          fi
          sleep 5
        done
        if [ "${found}" -eq 0 ]; then
          echo "::error::OpenCode summary comment not found after 6 retries — review may have silently failed"
          exit 1
        fi

    # ── Emit per-run telemetry (uploaded as an artifact) ─────────────────────
    - name: Emit review telemetry
      if: always()
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        RUN_ID: ${{ github.run_id }}
        BASE_SHA: ${{ steps.context.outputs.base_sha }}
        HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        CONTEXT_VERDICT: ${{ steps.context.outputs.verdict }}
        SERENA_STATUS: ${{ steps.serena.outputs.status }}
        MODE: ${{ steps.pr-info.outputs.mode }}
      run: |
        mkdir -p "$RUNNER_TEMP/telemetry"
        node -e "
          const fs = require('fs');
          const row = {
            pr: Number(process.env.PR_NUMBER),
            run_id: process.env.RUN_ID,
            mode: process.env.MODE || null,
            base_sha: process.env.BASE_SHA || null,
            head_sha: process.env.HEAD_SHA || null,
            context: { verdict: process.env.CONTEXT_VERDICT || null },
            serena: { status: process.env.SERENA_STATUS || 'disabled' }
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/telemetry/review-run.json', JSON.stringify(row, null, 2) + '\n');
        "

    - name: Upload telemetry artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: review-telemetry-${{ github.run_id }}
        path: ${{ runner.temp }}/telemetry/review-run.json
        if-no-files-found: ignore

    # ── Post failure comment ────────────────────────────────────────────────
    - name: Post failure comment
      if: failure() || cancelled()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "::group::Post failure comment"
        for i in $(seq 3); do
          if gh pr comment "${{ inputs.issue_number || github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "**OpenCode review failed unexpectedly.** Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."; then
            echo "Failure comment posted"
            break
          fi
          echo "Attempt ${i}/3 failed, retrying in 5s..."
          sleep 5
        done
        echo "::endgroup::"
