name: OpenCode PR Analysis
description: Runs a headless, read-only review and emits a validated local findings artifact.

inputs:
  api_key:
    description: Provider API key.
    required: true
  api_key_env:
    description: Optional provider environment override; known providers derive it from model.
    required: false
    default: ''
  model:
    description: OpenCode model.
    required: true
  variant:
    description: OpenCode variant.
    required: false
    default: max
  analysis_input:
    description: Absolute path to analysis-input.json.
    required: true
  opencode_version:
    description: Exact OpenCode release version.
    required: true
  opencode_download_url:
    description: Immutable HTTPS asset URL for the exact OpenCode release.
    required: true
  opencode_sha256:
    description: Lowercase SHA-256 digest of the OpenCode release asset.
    required: true
  enable_serena:
    description: Enable fail-open experimental Serena MCP context.
    required: false
    default: "false"
  serena_version:
    description: Exact 40-character Serena commit SHA.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install verified OpenCode CLI
      shell: bash
      run: node "${{ github.action_path }}/../scripts/install-opencode.mjs" "${{ inputs.opencode_download_url }}" "${{ inputs.opencode_sha256 }}" "${{ inputs.opencode_version }}" "$RUNNER_TEMP/opencode/bin/opencode"
    - name: Run safe headless analysis
      shell: bash
      env:
        API_KEY_VALUE: ${{ inputs.api_key }}
        API_KEY_OVERRIDE: ${{ inputs.api_key_env }}
        OPENCODE_MODEL: ${{ inputs.model }}
        ENABLE_SERENA: ${{ inputs.enable_serena }}
        SERENA_VERSION: ${{ inputs.serena_version }}
      run: |
        set -euo pipefail
        serena_home="$RUNNER_TEMP/serena"
        node "${{ github.action_path }}/../scripts/prepare-serena.mjs" "$ENABLE_SERENA" "$SERENA_VERSION" "$serena_home" "$PWD" "${{ inputs.analysis_input }}" "$RUNNER_TEMP/serena-status.json" "${{ github.action_path }}/../scripts/setup-serena.sh" "${{ github.action_path }}/../poc/serena/readiness-report.md"
        API_KEY_NAME="$(node "${{ github.action_path }}/../scripts/resolve-provider-env.mjs" "${OPENCODE_MODEL}" "${API_KEY_OVERRIDE}")"
        export API_KEY_NAME
        export "${API_KEY_NAME}=${API_KEY_VALUE}"
        node -e 'const fs=require("fs");const p=process.argv[1],v=JSON.parse(fs.readFileSync(p));v.executable=process.env.RUNNER_TEMP+"/opencode/bin/opencode";v.model=process.env.OPENCODE_MODEL;v.providerKeyEnv=process.env.API_KEY_NAME;fs.writeFileSync(p,JSON.stringify(v))' "${{ inputs.analysis_input }}"
        node "${{ github.action_path }}/../scripts/run-review-analysis.mjs" "${{ inputs.analysis_input }}"
