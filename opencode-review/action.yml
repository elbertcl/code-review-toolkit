name: OpenCode PR Review
description: OpenCode PR review with re-review mode detection.

inputs:
  api_key:
    description: API key for the model provider (e.g. OpenRouter, OpenCode).
    required: false
    default: ""
  api_key_env:
    description: >-
      Override for the env var name the API key is exported under. Leave
      empty (default) to auto-derive from the provider prefix in `model`
      (e.g. openrouter/... -> OPENROUTER_API_KEY). Only needed for a
      provider not in the toolkit's known table.
    required: false
    default: ""
  model:
    description: OpenCode model.
    required: false
    default: opencode-go/deepseek-v4-pro
  variant:
    description: OpenCode variant.
    required: false
    default: max
  mentions:
    description: Mention command passed to OpenCode.
    required: false
    default: /review
  share:
    description: Whether OpenCode sharing is enabled.
    required: false
    default: "false"
  use_github_token:
    description: Use GitHub Actions GITHUB_TOKEN instead of OpenCode GitHub App token exchange.
    required: false
    default: "false"
  github_token:
    description: GitHub token passed to OpenCode when use_github_token is true.
    required: false
    default: ${{ github.token }}
  extra_prompt:
    description: Extra consuming-repo review instructions.
    required: false
    default: ""
  issue_number:
    description: PR/issue number for workflow_dispatch triggers (leave empty for issue_comment triggers).
    required: false
    default: ""
  verdict_marker:
    description: HTML comment marker identifying a completed review verdict (used in mode detection and loop guard).
    required: false
    default: "<!-- opencode-pr-review -->"
  head_marker:
    description: HTML comment marker identifying the reviewed HEAD SHA (used in loop guard and verify).
    required: false
    default: "<!-- reviewed-head:"
  skip_context:
    description: Skip the toolkit's built-in context preparation (use when the caller provides its own compiled context at review_context.md).
    required: false
    default: "false"
  serena:
    description: Enable Serena MCP symbol lookup during review (fail-open if unavailable).
    required: false
    default: "true"
  serena_sha:
    description: Exact 40-char commit SHA of oraios/serena to install.
    required: false
    default: "dd12fa032f473a53595763b8d731817e19c15475"
  fail_closed_context:
    description: Abort the review when compiled context status is BLOCKED.
    required: false
    default: "true"
  ocr_llm_url:
    description: OCR LLM endpoint URL (required for OCR review).
    required: false
    default: ""
  ocr_llm_token:
    description: OCR LLM auth token (required for OCR review).
    required: false
    default: ""
  org_profiles:
    description: >-
      Comma-separated organization profiles (e.g. backend/security,backend/sre).
      Required for OCR review. Valid values - backend/security, backend/sre,
      frontend/security, frontend/sre.
    required: false
    default: "backend/security,backend/sre"

  ocr_model:
    description: >-
      OCR LLM model ID passed to `ocr config set llm.model`. Per-repo choice;
      verify IDs against the provider catalog before use.
    required: false
    default: "deepseek/deepseek-v4-pro"

  ocr_cost_rates:
    description: >-
      Optional JSON mapping model IDs to per-million-token rates.
      Example: {"deepseek/deepseek-v4-pro":{"input_per_million":0.14,"output_per_million":0.28,"cache_read_per_million":0.014}}
      When omitted, tokens and elapsed are shown but no dollar cost.
    required: false
    default: ""

  metrics_datadog_api_key:
    description: >-
      Optional Datadog API key. When set, per-run efficiency/context/reliability
      metrics are pushed directly from the review run (best-effort, never fails
      the review). When empty, pushing is skipped.
    required: false
    default: ""
  metrics_datadog_site:
    description: Datadog site (e.g. datadoghq.com, us5.datadoghq.com).
    required: false
    default: "datadoghq.com"

runs:
  using: composite
  steps:
    # ── Export provider API key under its provider-specific env var name ───
    # Env var *names* can't be built from expressions in a declarative `env:`
    # map, so this exports it via $GITHUB_ENV instead. The value itself never
    # appears in the run script's logged source (bash expands $API_KEY_VALUE
    # at runtime, not the Actions expression engine at log time).
    #
    # api_key_env is an override — by default the env var name is derived
    # from model's provider prefix, so consuming repos only ever need to set
    # `model` + `api_key`, never opencode's internal per-provider env names.
    - name: Export provider API key
      shell: bash
      env:
        API_KEY_VALUE: ${{ inputs.api_key }}
        API_KEY_OVERRIDE: ${{ inputs.api_key_env }}
        MODEL: ${{ inputs.model }}
      run: |
        if [ -n "${API_KEY_OVERRIDE}" ]; then
          API_KEY_NAME="${API_KEY_OVERRIDE}"
        else
          PROVIDER="${MODEL%%/*}"
          case "${PROVIDER}" in
            opencode-go) API_KEY_NAME=OPENCODE_API_KEY ;;
            openrouter)  API_KEY_NAME=OPENROUTER_API_KEY ;;
            anthropic)   API_KEY_NAME=ANTHROPIC_API_KEY ;;
            openai)      API_KEY_NAME=OPENAI_API_KEY ;;
            deepseek)    API_KEY_NAME=DEEPSEEK_API_KEY ;;
            groq)        API_KEY_NAME=GROQ_API_KEY ;;
            *)
              echo "::error::No known api_key_env mapping for provider '${PROVIDER}' (from model '${MODEL}'). Set api_key_env explicitly to override."
              exit 1
              ;;
          esac
        fi
        echo "${API_KEY_NAME}=${API_KEY_VALUE}" >> "$GITHUB_ENV"

    # ── PR metadata + mode detection ───────────────────────────────────────
    - name: Resolve PR metadata and acknowledge
      id: pr-info
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const issueNumberInput = '${{ inputs.issue_number }}';
          const issueNumber = (issueNumberInput ? Number(issueNumberInput) : null)
            || context.payload.pull_request?.number
            || context.payload.issue?.number;
          const commentId = context.payload.comment ? context.payload.comment.id : null;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

          const { data: pr } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: issueNumber
          });

          if (pr.draft) {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: '**Review skipped:** PR is still a draft.'
            });
            core.setOutput('skip', 'true');
            return;
          }

          // Detect mode: search for prior verdict marker comments.
          // The verdict marker is the definitive signal that a full
          // OpenCode review cycle completed on this PR.
          const verdictMarker = '${{ inputs.verdict_marker }}';
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number: issueNumber, per_page: 100
          });
          const priorVerdicts = comments.filter(c =>
            c.user.login === 'github-actions[bot]' &&
            c.body.includes(verdictMarker)
          );
          const mode = issueNumberInput ? 'review' : (priorVerdicts.length === 0 ? 'review' : 're-review');
          core.info(`==> Mode: ${mode} (${priorVerdicts.length} prior verdict(s))`);

          if (commentId) {
            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: commentId,
              content: 'eyes'
            });
          }

          const emoji = mode === 'review' ? '🔍' : '🔄';
          const label = mode === 'review' ? 'AI review started' : 'AI re-review started';
          await github.rest.issues.createComment({
            owner, repo, issue_number: issueNumber,
            body: `${emoji} **${label}** for commit \`${pr.head.sha.slice(0, 7)}\`. [View workflow run](${runUrl})`
          });

          core.setOutput('skip',       'false');
          core.setOutput('head_sha',   pr.head.sha);
          core.setOutput('pr_url',     pr.html_url);
          core.setOutput('mode',       mode);
          core.setOutput('pr_author',  pr.user.login);

    # ── Re-review: pre-flight guard ───────────────────────────────────────
    - name: Re-review pre-flight check
      id: preflight
      if: steps.pr-info.outputs.skip == 'false' && steps.pr-info.outputs.mode == 're-review'
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: |
          const owner    = context.repo.owner;
          const repo     = context.repo.repo;
          const prNum    = context.payload.issue.number;
          const verdictMarker = '${{ inputs.verdict_marker }}';
          const headMarker = '${{ inputs.head_marker }}';

          // Fetch all inline comments by github-actions[bot] that match the
          // OpenCode review format ([SEVERITY] prefix).
          const { data: inlineComments } = await github.rest.pulls.listReviewComments({
            owner, repo, pull_number: prNum, per_page: 100
          });
          const severityPrefixes = /^\*\*\[(CRITICAL|HIGH|MEDIUM|LOW)/i;
          const reviewerComments = inlineComments.filter(c =>
            c.user.login === 'github-actions[bot]' &&
            severityPrefixes.test(c.body || '')
          );

          if (reviewerComments.length === 0) {
            // Phase 2.1: No prior inline reviewer comments.
            // If HEAD changed since the last verdict, the prior run was incomplete
            // (verdict posted but inline batch failed/timed out). Auto-switch to
            // a fresh full review.
            const currentHeadSha = '${{ steps.pr-info.outputs.head_sha }}';
            const { data: allIssueComments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNum, per_page: 100
            });
            const verdictComments = allIssueComments
              .filter(c => c.user.login === 'github-actions[bot]' && c.body.includes(verdictMarker) && c.body.includes(headMarker))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let lastVerdictSha = null;
            if (verdictComments.length > 0) {
              const match = verdictComments[0].body.match(new RegExp(headMarker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' ([a-f0-9]+) -->'));
              if (match) lastVerdictSha = match[1];
            }

            if (lastVerdictSha && lastVerdictSha !== currentHeadSha) {
              core.info(`Phase 2.1: No inline comments but HEAD changed (${lastVerdictSha.slice(0, 7)} → ${currentHeadSha.slice(0, 7)}) — auto-switching to fresh full review`);
              core.setOutput('skip', 'false');
              core.setOutput('mode_override', 'review');
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: prNum,
              body: '**Re-review skipped:** No prior inline review comments found from the last review. This PR has not been fully reviewed yet. Triggering a fresh review instead is recommended — delete the existing `PR Verdict:` comment and comment `/review` again.'
            });
            core.setOutput('skip', 'true');
            return;
          }

          // Phase 2.3: Check if a complete review cycle already exists for this HEAD.
          const currentHeadSha = '${{ steps.pr-info.outputs.head_sha }}';
          const { data: issueComments } = await github.rest.issues.listComments({
            owner, repo, issue_number: prNum, per_page: 100
          });
          const verdictForCurrentHead = issueComments.some(c =>
            c.user.login === 'github-actions[bot]' &&
            c.body.includes(verdictMarker) &&
            c.body.includes(`${headMarker} ${currentHeadSha} -->`)
          );

          if (verdictForCurrentHead) {
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNum,
              body: `**Re-review skipped:** No changes since last review (head is still \`${currentHeadSha.slice(0, 7)}\`).`
            });
            core.setOutput('skip', 'true');
            return;
          }

          core.setOutput('skip', 'false');

    # ── Re-review: verify commenter is PR author or trusted member ──────────
    - name: Re-review security check
      id: security
      if: steps.pr-info.outputs.skip == 'false' && steps.pr-info.outputs.mode == 're-review' && steps.preflight.outputs.skip != 'true' && steps.preflight.outputs.mode_override != 'review'
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: |
          const commenterLogin = context.payload.comment.user.login;
          const authorAssoc    = context.payload.comment.author_association;
          const prAuthor       = '${{ steps.pr-info.outputs.pr_author }}';
          const trusted        = ['OWNER', 'MEMBER', 'COLLABORATOR'];

          if (commenterLogin !== prAuthor && !trusted.includes(authorAssoc)) {
            core.info(`${commenterLogin} is not the PR author or a trusted member — skipping re-review`);
            core.setOutput('skip', 'true');
            return;
          }
          core.setOutput('skip', 'false');

    # ── Review mode: guard against reviewing the same commit twice ──────────
    - name: Loop guard
      id: loop_guard
      if: steps.pr-info.outputs.skip == 'false' && (steps.pr-info.outputs.mode == 'review' || steps.preflight.outputs.mode_override == 'review')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        HEAD_SHA="${{ steps.pr-info.outputs.head_sha }}"
        PR_NUMBER="${{ inputs.issue_number || github.event.issue.number }}"
        REPO="${{ github.repository }}"

        # Check if a *complete* OpenCode review cycle already exists for this HEAD.
        # A complete cycle is proven by a verdict comment containing both markers.
        #
        # Do NOT use pull review comment commit_id here. GitHub can rebind inline
        # comments to the current PR head after later pushes/merges, which causes
        # false "already reviewed" skips even when this HEAD never received a full
        # verdict. The verdict marker is the stable source of truth.
        EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --paginate \
          --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${{ inputs.verdict_marker }}\")) and (.body | contains(\"${{ inputs.head_marker }} ${HEAD_SHA} -->\")))] | length")

        if [ "${EXISTING}" -gt "0" ]; then
          echo "Loop guard: complete review already exists for commit ${HEAD_SHA} — skipping"
          gh pr comment "${PR_NUMBER}" \
            --body "**Review skipped:** Commit \`${HEAD_SHA:0:7}\` was already fully reviewed. Push a new commit to trigger a re-review."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    # ── Context preparation (both modes) ────────────────────────────────────
    - name: Prepare review context
      id: context
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true' &&
        inputs.skip_context != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        REPO: ${{ github.repository }}
      run: |
        BASE_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.base.sha')
        HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
        gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' \
          | node -e "process.stdout.write(JSON.stringify(require('fs').readFileSync(0,'utf8').split('\n').filter(Boolean)))" \
          > "${RUNNER_TEMP}/changed-files.json"
        echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
        echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

    # ── Serena cache ───────────────────────────────────────────────────────
    - name: Cache Serena uvx
      if: inputs.serena == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/serena/cache
        key: serena-uvx-${{ inputs.serena_sha }}

    # ── Serena setup (fail-open, used by review fetcher) ──────────────────────
    - name: Set up Serena
      id: serena
      if: |
        inputs.serena == 'true' &&
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      run: |
        if ! command -v uvx >/dev/null 2>&1; then
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
        fi
        SERENA_HOME="$RUNNER_TEMP/serena"
        STATUS_JSON="$RUNNER_TEMP/serena-status.json"
        bash "${{ github.action_path }}/serena/install-and-probe.sh" \
          "${{ inputs.serena_sha }}" "$SERENA_HOME" "$STATUS_JSON" || true
        STATUS=$(node -pe "try { JSON.parse(require('fs').readFileSync('$STATUS_JSON','utf8')).status } catch { 'unavailable' }")
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        if [ "$STATUS" = "available" ]; then
          echo "SERENA_HOME=$SERENA_HOME" >> "$GITHUB_ENV"
        fi

    # ── Run Serena fetcher for review context ──────────────────────────────────
    - name: Fetch Serena context
      if: |
        steps.serena.outputs.status == 'available' &&
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      run: |
        node "${{ github.action_path }}/dist/context/fetch-serena-context.js" \
          "$PWD" \
          "$RUNNER_TEMP/changed-files.json" \
          "20" \
          /tmp/serena-context.md \
          "${SERENA_HOME}/bin/serena-readonly" || true

    # ── Review engine ──────────────────────────────────────────────────────────
    - name: Validate review secrets
      id: ocr-secrets
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "${{ inputs.ocr_llm_url }}" ] || [ -z "${{ inputs.ocr_llm_token }}" ]; then
          echo "::error::LLM endpoint URL and auth token are required."
          gh pr comment "${{ inputs.issue_number || github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "**Review aborted:** missing LLM configuration."
          exit 1
        fi

    - name: Fetch open PR review threads
      id: ocr-threads
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      uses: actions/github-script@v8
      env:
        PR_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const prNumber = Number(process.env.PR_NUMBER);

          const threadsQuery = `
            query($owner: String!, $repo: String!, $prNumber: Int!, $cursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $prNumber) {
                  reviewThreads(first: 100, after: $cursor) {
                    nodes {
                      isResolved
                      isOutdated
                      comments(first: 100) {
                        totalCount
                        nodes {
                          author { login }
                          body
                          path
                          line
                        }
                      }
                    }
                    pageInfo { hasNextPage, endCursor }
                  }
                }
              }
            }
          `;

          let allThreads = [];
          let cursor = null;
          let hasNextPage = true;

          while (hasNextPage) {
            const result = await github.graphql(threadsQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              prNumber,
              cursor,
            });
            const threads = result.repository.pullRequest.reviewThreads;
            allThreads.push(...threads.nodes);
            hasNextPage = threads.pageInfo.hasNextPage;
            cursor = threads.pageInfo.endCursor;
          }

          const threads = [];
          const anchors = [];

          for (const thread of allThreads) {
            const comments = thread.comments.nodes;
            const latestComment = comments[comments.length - 1];
            if (!latestComment || !latestComment.path || latestComment.line == null) continue;

            const humanBodies = comments
              .filter(c => c.author && c.author.login && !c.author.login.endsWith('[bot]'))
              .map(c => c.body || '');

            threads.push({
              path: latestComment.path,
              line: latestComment.line,
              current_line: latestComment.line,
              is_resolved: thread.isResolved,
              is_outdated: thread.isOutdated,
              latest_author: latestComment.author ? latestComment.author.login : 'unknown',
              latest_body_excerpt: (latestComment.body || '').slice(0, 300),
              comment_count: thread.comments.totalCount,
              human_bodies: humanBodies,
            });

            anchors.push({
              path: latestComment.path,
              line: latestComment.line,
              is_resolved: thread.isResolved,
              is_outdated: thread.isOutdated,
            });
          }

          fs.writeFileSync('/tmp/open-threads.json', JSON.stringify(threads));
          fs.writeFileSync('/tmp/open-thread-anchors.json', JSON.stringify(anchors));
          core.info(`Collected ${threads.length} review threads via GraphQL (${anchors.filter(a => a.is_resolved).length} resolved, ${anchors.filter(a => a.is_outdated).length} outdated)`);

    - name: Remap review anchors (resolved + current lines)
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      run: node "${{ github.action_path }}/dist/ocr/remap-anchors.js" /tmp/open-thread-anchors.json /tmp/remapped-anchors.json

    - name: Build resolved-thread directives
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      run: node "${{ github.action_path }}/dist/ocr/resolved-directives.js" /tmp/open-threads.json /tmp/resolved-directives.json

    - name: Build review background
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      run: node "${{ github.action_path }}/dist/ocr/build-background.js" /tmp/open-threads.json /tmp/serena-context.md > /tmp/background.md

    - name: Compile review rules
      id: ocr-rules
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SERENA_STATUS: ${{ steps.serena.outputs.status }}
        ORG_PROFILES_INPUT: ${{ inputs.org_profiles }}
        FAIL_CLOSED_CONTEXT: ${{ inputs.fail_closed_context }}
      run: |
        ORG_PROFILES_INPUT="${{ inputs.org_profiles }}"
        if [ -z "${ORG_PROFILES_INPUT}" ]; then
          echo "::error::org_profiles is required. Valid values: backend/security, backend/sre, frontend/security, frontend/sre."
          gh pr comment "${{ inputs.issue_number || github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "**Review aborted:** missing required org_profiles input."
          exit 1
        fi
        export ORG_PROFILES_INPUT
        node "${{ github.action_path }}/dist/context/resolve-manifest.js" \
          "REVIEW.md" \
          "${{ github.action_path }}/context/defaults/REVIEW.md" \
          "${{ github.action_path }}/context/defaults/manifest-defaults.json" \
          "${RUNNER_TEMP}/changed-files.json" \
          "$PWD" \
          "/tmp/resolved-manifest.json" \
          "/tmp/manifest-status.json"
        STATUS=$(node -pe "JSON.parse(require('fs').readFileSync('/tmp/manifest-status.json','utf8')).status")
        if [ "$STATUS" = "BLOCKED" ] && [ "${FAIL_CLOSED_CONTEXT}" = "true" ]; then
          BODY=$(node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/manifest-status.json','utf8'));process.stdout.write('**Review aborted:** required review context is missing or invalid. Fix these and re-run \`/review-ocr\`:\n\n'+s.blockers.map(b=>'- '+b).join('\n'))")
          gh pr comment "${{ inputs.issue_number || github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "$BODY"
          echo "aborted_with_comment=true" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        node --input-type=module -e "
          import { compileOcrRules } from '${{ github.action_path }}/dist/ocr/compile-ocr-rules.js';
          import { globMatches } from '${{ github.action_path }}/dist/context/lib/review-manifest.js';
          import { readFileSync, writeFileSync, existsSync, statSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('/tmp/resolved-manifest.json', 'utf8'));
          let policyBody = existsSync(manifest.policy_path) ? readFileSync(manifest.policy_path, 'utf8') : '';
          if (!policyBody) {
            policyBody = JSON.parse(readFileSync('/tmp/manifest-status.json', 'utf8')).defaultPolicyBody || '';
          }
          let resolvedDirectives = [];
          if (existsSync('/tmp/resolved-directives.json')) {
            resolvedDirectives = JSON.parse(readFileSync('/tmp/resolved-directives.json', 'utf8'));
          }
          const orgProfiles = process.env.ORG_PROFILES_INPUT.split(',').map(p => p.trim()).filter(Boolean);
          const rules = compileOcrRules({
            workspace: process.cwd(),
            changedFiles: [],
            orgContextsDir: '\${{ github.action_path }}/context/contexts',
            manifest,
            policyBody,
            resolvedDirectives,
            orgProfiles,
          });
          writeFileSync(process.env.RUNNER_TEMP + '/ocr-rule.json', JSON.stringify(rules, null, 2) + '\n');
          const changed = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/changed-files.json', 'utf8'));
          const matchedConditional = (manifest.conditional_context ?? []).filter(
            (c) => c.when_changed.some((g) => changed.some((f) => globMatches(g, f)))
          );
          const matchedDirectives = (manifest.review_directives ?? []).filter(
            (d) => d.when_changed.some((g) => changed.some((f) => globMatches(g, f)))
          );
          const fileSize = (p) => { try { return statSync(p).size; } catch { return 0; } };
          writeFileSync(process.env.RUNNER_TEMP + '/context-metrics.json', JSON.stringify({
            rules_compiled: rules.rules.length,
            conditional_contexts_matched: matchedConditional.map((c) => c.paths.join(',')),
            directives_applied: matchedDirectives.length,
            rule_json_bytes: fileSize(process.env.RUNNER_TEMP + '/ocr-rule.json'),
            background_bytes: fileSize('/tmp/background.md'),
            serena_pointer_chars: fileSize('/tmp/serena-context.md'),
          }, null, 2) + '\n');
        "
        FALLBACK_REASON=$(node -pe "JSON.parse(require('fs').readFileSync('/tmp/manifest-status.json','utf8')).fallbackReason || ''")
        if [ -n "${FALLBACK_REASON}" ]; then
          SERENA="${SERENA_STATUS:-unavailable}"
          gh pr comment "${{ inputs.issue_number || github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "⚠️ **Review ran with ORG-DEFAULT rules only.** Serena: ${SERENA}. Your repo \`REVIEW.md\` was not applied: ${FALLBACK_REASON}. Repo-specific rules (conditional invariants, testspecs, review_directives) did **not** apply this run. Fix \`REVIEW.md\` to restore them."
        fi

    - name: Install and run review CLI
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      shell: bash
      env:
        BASE_SHA: ${{ steps.context.outputs.base_sha }}
        HEAD_SHA: ${{ steps.context.outputs.head_sha }}
      run: |
        npm install -g --force @alibaba-group/open-code-review@1.8.9 2>&1
        hash -r
        which ocr || { echo "::error::ocr CLI not found after install"; exit 1; }
        ocr config set llm.url "${{ inputs.ocr_llm_url }}"
        ocr config set llm.auth_token "${{ inputs.ocr_llm_token }}"
        ocr config set llm.protocol openai
        ocr config set llm.model "${{ inputs.ocr_model }}"
        echo "=== Running review ==="
        ocr review --from "$BASE_SHA" --to "$HEAD_SHA" \
          --rule "$RUNNER_TEMP/ocr-rule.json" \
          --background-file /tmp/background.md \
          --format json > /tmp/findings.json

    - name: Post review findings
      if: |
        steps.pr-info.outputs.skip == 'false' &&
        steps.preflight.outputs.skip != 'true' &&
        steps.loop_guard.outputs.skip != 'true' &&
        steps.security.outputs.skip != 'true'
      uses: actions/github-script@v8
      env:
        HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
        PR_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        SERENA_STATUS: ${{ steps.serena.outputs.status }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const prNumber = Number(process.env.PR_NUMBER);
          const headSha = process.env.HEAD_SHA || '';
          const rawText = fs.readFileSync('/tmp/findings.json', 'utf8');
          const jsonStart = rawText.indexOf('{');
          const jsonEnd = rawText.lastIndexOf('}');
          const rawFindings = jsonStart >= 0 ? JSON.parse(rawText.slice(jsonStart, jsonEnd + 1)) : {};
          const findings = Array.isArray(rawFindings) ? rawFindings : (rawFindings.comments || []);

          const summary = rawFindings.summary || {};
          const manifest = rawFindings.manifest || {};
          const llmModel = rawFindings.llm?.model || manifest?.execution?.model || '';
          const ocrTokens = {
            total: summary.total_tokens || 0,
            input: summary.input_tokens || 0,
            output: summary.output_tokens || 0,
            cache_read: summary.cache_read_tokens || 0,
          };
          let anchors = [];
          if (fs.existsSync('/tmp/remapped-anchors.json')) {
            anchors = JSON.parse(fs.readFileSync('/tmp/remapped-anchors.json', 'utf8'));
          }

          const { computeFindings, buildVerdictComment, parseDiffPatches } = await import('\${{ github.action_path }}/dist/ocr/post-findings.js');
          const { data: prFiles } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
            per_page: 100,
          });
          const diffLines = parseDiffPatches(prFiles.map(f => ({ filename: f.filename, patch: f.patch })));
          const result = computeFindings({ findings, anchors, diffLines });

          // Parse optional rate table for cost computation
          let rates = null;
          const ratesInput = '${{ inputs.ocr_cost_rates }}';
          if (ratesInput) {
            try { rates = JSON.parse(ratesInput); } catch { core.warning('ocr_cost_rates is not valid JSON - cost will be omitted'); }
          }

          const { computeCost } = await import('\${{ github.action_path }}/dist/ocr/compute-cost.js');
          const cost = computeCost(
            { input_tokens: ocrTokens.input, output_tokens: ocrTokens.output, cache_read_tokens: ocrTokens.cache_read },
            rates,
            llmModel,
          );

          const { buildMeasurementRow } = await import('\${{ github.action_path }}/dist/ocr/append-measurement.js');
          const toolCallsByTool = rawFindings.tool_calls?.by_tool || null;
          const measurementRow = buildMeasurementRow({
            verdict: result.kept.length > 0 ? 'FAIL' : 'PASS',
            findings: result.kept,
            suppressed: result.dropped.length,
            tokens: ocrTokens,
            prNumber,
            sha: headSha,
            cost,
            elapsedMs: manifest?.elapsed_ms || null,
            toolCalls: toolCallsByTool,
          });

          if (result.comments.length > 0) {
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'COMMENT',
                comments: result.comments,
              });
            } catch (e) {
              if (e.status === 422) {
                core.warning(`Batch createReview got 422 — retrying per-comment and downgrading failures`);
                const failedComments = [];
                for (const comment of result.comments) {
                  try {
                    await github.rest.pulls.createReview({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: prNumber,
                      event: 'COMMENT',
                      comments: [comment],
                    });
                  } catch (e2) {
                    failedComments.push(comment);
                  }
                }
                if (failedComments.length > 0) {
                  const body = failedComments.map(c =>
                    `**${c.path}:${c.line}** (line not in diff — posted as summary)\n\n${c.body}`
                  ).join('\n\n---\n\n');
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `### Review findings (non-inline)\n\n${body}`,
                  });
                }
              } else {
                throw e;
              }
            }
          }

          if (result.message) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: result.message,
            });
          }

          let serenaStatus = process.env.SERENA_STATUS || 'unavailable';
          let manifestStatus = undefined;
          if (fs.existsSync('/tmp/manifest-status.json')) {
            manifestStatus = JSON.parse(fs.readFileSync('/tmp/manifest-status.json', 'utf8'));
          } else if (fs.existsSync('/tmp/manifest-fallback-reason')) {
            manifestStatus = { fallbackReason: fs.readFileSync('/tmp/manifest-fallback-reason', 'utf8').trim() };
          }

          const verdictBody = buildVerdictComment({
            findings: result.kept,
            headSha,
            verdictMarker: '${{ inputs.verdict_marker }}',
            headMarker: '${{ inputs.head_marker }}',
            model: '${{ inputs.ocr_model }}',
            serenaStatus,
            manifestStatus,
            measurement: {
              tokens: ocrTokens,
              cost,
              elapsedMs: manifest?.elapsed_ms || null,
              toolCalls: rawFindings.tool_calls,
            },
          });
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: verdictBody,
          });

          const ruleRe = /RULE-[A-Z]+-\d+/i;
          const ruleCited = result.kept.filter((f) => ruleRe.test(f.message || f.content || "")).length;
          fs.writeFileSync('/tmp/ocr-result.json', JSON.stringify({
            kept: result.kept.length,
            dropped: result.dropped.length,
            resolved: result.resolved.length,
            snapped: result.snappedCount,
            rule_cited: ruleCited,
            measurement: measurementRow,
          }));

    # ── Emit per-run telemetry (uploaded as an artifact) ─────────────────────
    - name: Emit review telemetry
      if: always()
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        RUN_ID: ${{ github.run_id }}
        BASE_SHA: ${{ steps.context.outputs.base_sha }}
        HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        SERENA_STATUS: ${{ steps.serena.outputs.status }}
        MODE: ${{ steps.pr-info.outputs.mode }}
        ENGINE: ocr
        REPO: ${{ github.repository }}
        MODEL: ${{ inputs.ocr_model }}
        ORG_PROFILES: ${{ inputs.org_profiles }}
      run: |
        mkdir -p "$RUNNER_TEMP/telemetry"
        node -e "
          const fs = require('fs');
          let ocrResult = {};
          try { ocrResult = JSON.parse(fs.readFileSync('/tmp/ocr-result.json', 'utf8')); } catch {}
          const measurement = ocrResult.measurement || {};

          let contextBlock = {};
          try { contextBlock = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/context-metrics.json', 'utf8')); } catch {}
          try {
            const ms = JSON.parse(fs.readFileSync('/tmp/manifest-status.json', 'utf8'));
            contextBlock.manifest_status = ms.status;
            contextBlock.fallback_reason = ms.fallbackReason || '';
          } catch {}
          contextBlock.rule_citation_rate = (ocrResult.rule_cited != null && (ocrResult.kept || 0) > 0)
            ? ocrResult.rule_cited / ocrResult.kept : null;

          const row = {
            pr: Number(process.env.PR_NUMBER),
            run_id: process.env.RUN_ID,
            engine: process.env.ENGINE || 'ocr',
            repo: process.env.REPO || null,
            model: process.env.MODEL || 'deepseek/deepseek-v4-pro',
            org_profiles: process.env.ORG_PROFILES || null,
            context: contextBlock,
            mode: process.env.MODE || null,
            base_sha: process.env.BASE_SHA || null,
            head_sha: process.env.HEAD_SHA || null,
            serena: { status: process.env.SERENA_STATUS || 'disabled' },
            timestamp: measurement.timestamp || new Date().toISOString(),
            verdict: (ocrResult.kept || 0) > 0 ? 'FAIL' : 'PASS',
            findings: {
              kept: ocrResult.kept || 0,
              dropped: ocrResult.dropped || 0,
              resolved: ocrResult.resolved || 0,
              snapped: ocrResult.snapped || 0,
            },
            severity_tally: measurement.severity_tally || null,
            suppressed_as_duplicate: measurement.suppressed_as_duplicate || 0,
            tokens: measurement.tokens || null,
            cost: measurement.cost || null,
            elapsed_ms: measurement.elapsed_ms || null,
            tool_calls: measurement.tool_calls || null,
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/telemetry/review-run.json', JSON.stringify(row, null, 2) + '\n');
        "

    - name: Upload telemetry artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: review-telemetry-${{ github.run_id }}
        path: ${{ runner.temp }}/telemetry/review-run.json
        if-no-files-found: ignore

    - name: Push run metrics (Datadog)
      if: always() && inputs.metrics_datadog_api_key != ''
      shell: bash
      env:
        DD_API_KEY: ${{ inputs.metrics_datadog_api_key }}
        DD_SITE: ${{ inputs.metrics_datadog_site }}
      run: node "${{ github.action_path }}/dist/monitoring/push-run-metrics.js" "$RUNNER_TEMP/telemetry/review-run.json"

    # ── Post failure comment ────────────────────────────────────────────────
    - name: Post failure comment
      if: (failure() || cancelled()) && steps.ocr-rules.outputs.aborted_with_comment != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "::group::Post failure comment"
        for i in $(seq 3); do
          if gh pr comment "${{ inputs.issue_number || github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "**Review failed unexpectedly.** Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."; then
            echo "Failure comment posted"
            break
          fi
          echo "Attempt ${i}/3 failed, retrying in 5s..."
          sleep 5
        done
        echo "::endgroup::"
