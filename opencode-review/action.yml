name: OpenCode PR Analysis
description: Runs a headless, read-only review and emits a validated local findings artifact.

inputs:
  api_key:
    description: Provider API key.
    required: true
  api_key_env:
    description: Optional provider environment override; known providers derive it from model.
    required: false
    default: ''
  model:
    description: OpenCode model.
    required: true
  variant:
    description: OpenCode variant.
    required: false
    default: max
  analysis_input:
    description: Absolute path to analysis-input.json.
    required: true
  opencode_version:
    description: Exact OpenCode release version.
    required: true
  opencode_download_url:
    description: Immutable HTTPS asset URL for the exact OpenCode release.
    required: true
  opencode_sha256:
    description: Lowercase SHA-256 digest of the OpenCode release asset.
    required: true
  enable_serena:
    description: Enable fail-open experimental Serena MCP context.
    required: false
    default: "false"
  serena_version:
    description: Exact 40-character Serena commit SHA.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install verified OpenCode CLI
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OPENCODE_DOWNLOAD_URL: ${{ inputs.opencode_download_url }}
        OPENCODE_SHA256: ${{ inputs.opencode_sha256 }}
        OPENCODE_VERSION: ${{ inputs.opencode_version }}
      run: node "$ACTION_PATH/../scripts/install-opencode.mjs" "$OPENCODE_DOWNLOAD_URL" "$OPENCODE_SHA256" "$OPENCODE_VERSION" "$RUNNER_TEMP/opencode/bin/opencode"
    - name: Run safe headless analysis
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ANALYSIS_INPUT: ${{ inputs.analysis_input }}
        API_KEY_VALUE: ${{ inputs.api_key }}
        API_KEY_OVERRIDE: ${{ inputs.api_key_env }}
        OPENCODE_MODEL: ${{ inputs.model }}
        OPENCODE_VARIANT: ${{ inputs.variant }}
        ENABLE_SERENA: ${{ inputs.enable_serena }}
        SERENA_VERSION: ${{ inputs.serena_version }}
      run: |
        set -euo pipefail
        serena_home="$RUNNER_TEMP/serena"
        node "$ACTION_PATH/../scripts/prepare-serena.mjs" "$ENABLE_SERENA" "$SERENA_VERSION" "$serena_home" "$PWD" "$ANALYSIS_INPUT" "$RUNNER_TEMP/serena-status.json" "$ACTION_PATH/../scripts/setup-serena.sh" "$ACTION_PATH/../poc/serena/readiness-report.md"
        API_KEY_NAME="$(node "$ACTION_PATH/../scripts/resolve-provider-env.mjs" "$OPENCODE_MODEL" "$API_KEY_OVERRIDE")"
        export API_KEY_NAME
        export "${API_KEY_NAME}=${API_KEY_VALUE}"
        node -e 'const fs=require("fs");const p=process.argv[1],v=JSON.parse(fs.readFileSync(p));v.executable=process.env.RUNNER_TEMP+"/opencode/bin/opencode";v.model=process.env.OPENCODE_MODEL;v.providerKeyEnv=process.env.API_KEY_NAME;fs.writeFileSync(p,JSON.stringify(v))' "$ANALYSIS_INPUT"
        node "$ACTION_PATH/../scripts/run-review-analysis.mjs" "$ANALYSIS_INPUT"
