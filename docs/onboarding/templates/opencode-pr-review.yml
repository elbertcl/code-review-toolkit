name: AI PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: review-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: elbertcl/code-review-toolkit/opencode-review@v4
        with:
          mentions: /review
          use_github_token: true
          org_profiles: backend/security,backend/sre
          ocr_llm_url: ${{ secrets.REVIEW_LLM_URL }}
          ocr_llm_token: ${{ secrets.REVIEW_LLM_TOKEN }}
