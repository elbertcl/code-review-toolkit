name: Metrics Dashboard POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-fixture-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d7c243d3c8ba08f9218b7f891be
        with:
          node-version: "20"
      - name: Render sanitized fixture dashboard
        run: node scripts/render-metrics-dashboard.mjs tests/fixtures/metrics/input.json metrics-dashboard
      - name: Upload sanitized dashboard
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: metrics-dashboard-sanitized
          path: metrics-dashboard/
          if-no-files-found: error
          retention-days: 1
