name: PR Review (reusable)

on:
  workflow_call:
    inputs:
      org_profiles:
        required: true
        type: string
        description: Comma-separated org profiles (backend/security, backend/sre, frontend/security, frontend/sre).
      ocr_model:
        required: false
        type: string
        default: ""
        description: >-
          Explicit model override. Empty = resolve from REVIEW.md engine block,
          then org variable OCR_LLM_MODEL, then the toolkit default.
      ocr_cost_rates:
        required: false
        type: string
        default: ""
      ocr_version:
        required: false
        type: string
        default: "1.8.9"
      fail_closed_context:
        required: false
        type: string
        default: "true"
      issue_number:
        required: false
        type: string
        default: ""
      metrics_otlp_endpoint:
        required: false
        type: string
        default: "https://otlp-dev.astronauts.id/v1/metrics"

# Credentials are toolkit-owned: org-level secrets are available inside reusable
# workflows when callers use `secrets: inherit`. Consumers carry ZERO LLM/OTLP
# secrets of their own — the required-secret declarations were removed on purpose.
# Org secrets expected: OCR_LLM_URL, OCR_LLM_AUTH_TOKEN, OTLP_AUTH.
# Org variable: OCR_LLM_MODEL (fallback model when REVIEW.md engine omits one).

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout PR head (push and comment events)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
      - name: Run review
        uses: elbertcl/code-review-toolkit/opencode-review@v4
        with:
          use_github_token: true
          org_profiles: ${{ inputs.org_profiles }}
          ocr_model: ${{ inputs.ocr_model }}
          ocr_cost_rates: ${{ inputs.ocr_cost_rates }}
          ocr_version: ${{ inputs.ocr_version }}
          fail_closed_context: ${{ inputs.fail_closed_context }}
          issue_number: ${{ inputs.issue_number }}
          ocr_llm_url: ${{ secrets.OCR_LLM_URL }}
          ocr_llm_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          metrics_otlp_endpoint: ${{ inputs.metrics_otlp_endpoint }}
          metrics_otlp_auth: ${{ secrets.OTLP_AUTH }}
