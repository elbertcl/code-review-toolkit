name: Check Actions Approval Policy

on:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: actions-policy-audit
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - run: node scripts/check-actions-approval-policy.mjs
        env:
          GITHUB_ORGANIZATION: astronautsid
          GITHUB_TOKEN: ${{ secrets.ORG_ACTIONS_POLICY_TOKEN }}
