name: Toolkit CI

on:
  pull_request:
    paths:
      - "opencode-review/src/**"
      - "opencode-review/dist/**"
      - "opencode-review/action.yml"
      - "opencode-review/scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/toolkit-ci.yml"
  push:
    branches: [main]
    paths:
      - "opencode-review/src/**"
      - "opencode-review/dist/**"
      - "opencode-review/action.yml"
      - "opencode-review/scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/toolkit-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (compiled dist)
        run: npm test

      - name: Build
        run: npm run build

      - name: Check dist drift
        run: npm run check-dist

      - name: Check issue_number render (JS syntax guard)
        run: bash opencode-review/scripts/check-issue-number-render.sh
